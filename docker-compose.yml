
services:
  ui-frontend:
    build: .  # Looks for the Dockerfile in the current folder
    container_name: file-gallery
    ports:
      - "3000:3000"
    environment:
      - RESEND_API_KEY=${RESEND_API_KEY}
      - NEXT_PUBLIC_VERIFIED_SENDER=${NEXT_PUBLIC_VERIFIED_SENDER}
    restart: always
    networks:
      - ui-network

networks:
  ui-network:
    driver: bridge
