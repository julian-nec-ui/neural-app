# Build and deploy a Next.js site to GitHub Pages (pnpm, static export)
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Restore Next.js cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GitHub Pages serves only static files: the server routes (NextAuth API, middleware)
      # are removed from this build's copy of the code. Your repository is not changed.
      - name: Remove server-only routes (not supported on GitHub Pages)
        run: |
          rm -rf app/api src/app/api
          rm -f middleware.ts middleware.js src/middleware.ts src/middleware.js

      # Pages that read cookies, headers or the session on the server cannot be static:
      # they are left out of the GitHub Pages build (your repository is not changed).
      - name: Remove pages that need a server
        run: |
          for dir in app src/app; do
            [ -d "$dir" ] || continue
            grep -rlE "next/headers|getServerSession|cookies\(\)|headers\(\)" "$dir" \
              --include=page.tsx --include=page.ts --include=page.jsx --include=page.js \
              --include=layout.tsx --include=layout.ts \
              | while read -r f; do
                  route_dir=$(dirname "$f")
                  if [ "$route_dir" = "$dir" ]; then
                    echo "::warning::$f needs a server but it is the root page/layout; leaving it"
                  else
                    echo "Removing $route_dir (uses server-only APIs)"
                    rm -rf "$route_dir"
                  fi
                done
          done

      - name: Build (static export)
        run: pnpm run build
        env:
          GITHUB_PAGES: "true"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5